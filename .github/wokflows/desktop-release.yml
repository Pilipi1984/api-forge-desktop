name: Release Desktop

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:   # permite probar la compilación sin crear release

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer necesita el historial y los tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore ApiForge.sln
      - run: dotnet build ApiForge.sln -c Release --no-restore
      - run: dotnet test --solution ApiForge.sln -c Release --no-build

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT: ApiForge.Desktop-${{ github.ref_name }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: >
          dotnet publish ApiForge.Desktop/ApiForge.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -o publish/${{ env.ARTIFACT }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ env.ARTIFACT }}" -DestinationPath "${{ env.ARTIFACT }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "${{ env.ARTIFACT }}.tar.gz" -C publish "${{ env.ARTIFACT }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear la release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=""
          # tags tipo v1.0.3-preview.1 se publican como pre-release
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes $flags
